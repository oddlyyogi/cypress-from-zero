name: Cypress tests
on: push

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .

  e2e:
    needs: lint
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: cypress-io/github-action@v7
        with:
          browser: ${{ matrix.browser }}
          start: node practice/server.js
          wait-on: 'http://localhost:4321'
          spec: cypress/e2e/*.cy.js
        env:
          CYPRESS_customerEmail: ${{ secrets.CYPRESS_customerEmail }}
          CYPRESS_customerPassword: ${{ secrets.CYPRESS_customerPassword }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-${{ matrix.browser }}
          path: cypress/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ matrix.browser }}
          path: cypress/reports
          if-no-files-found: ignore
